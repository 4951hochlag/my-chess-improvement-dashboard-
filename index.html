const THEME_KEY='myChessDashboard_theme';let currentTheme=localStorage.getItem(THEME_KEY)||'dark';function applyTheme(){document.body.classList.toggle('light',currentTheme==='light');const b=document.getElementById('themeToggle');if(b)b.textContent=currentTheme==='light'?'☾ Dark mode':'☀ Light mode'}document.getElementById('themeToggle').onclick=()=>{currentTheme=currentTheme==='light'?'dark':'light';localStorage.setItem(THEME_KEY,currentTheme);applyTheme()};applyTheme();
document.body.classList.add("public-view");
 function coverOf(c){for(const k of ['coverUrl','coverImageUrl','imageUrl','cover','image','thumbnailUrl','thumbnail','coverImage']){let v=c[k];if(v&&typeof v==='object')v=v.url||v.src;if(typeof v==='string'&&/^https?:\/\//i.test(v))return v}return ''}
function courseUrl(c){for(const k of ['courseUrl','url','chessableUrl','link']){let v=c[k];if(typeof v==='string'&&/^https:\/\/(www\.)?chessable\.com\//i.test(v)&&!v.includes('/profile/'))return v}return ''}
// Stable course matching: tolerate the tracker accidentally appending author/progress text.
function cleanCourseName(name){return String(name||'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/\s*\d+\s*\/\s*\d+\s*variations?.*$/i,'').replace(/\s+/g,' ').trim()}
function courseIdentity(c){for(const k of ['courseId','chessableCourseId','id']){if(c[k]!=null&&String(c[k]).trim())return 'id:'+String(c[k]).trim()}let u=courseUrl(c);if(u)return 'url:'+u.replace(/\?.*$/,'').replace(/\/$/,'');return 'name:'+cleanCourseName(c.name)}
function sameCourse(a,b){if(courseIdentity(a)===courseIdentity(b))return true;let x=cleanCourseName(a.name),y=cleanCourseName(b.name);if(x===y)return true;const shorter=x.length<y.length?x:y,longer=x.length<y.length?y:x;return shorter.length>=15&&longer.startsWith(shorter)&&(/^[\s:–—-]/.test(longer.slice(shorter.length))||/\d/.test(longer.slice(shorter.length,shorter.length+3)))&&(!a.total||!b.total||Number(a.total)===Number(b.total))}

bined=dedupeCourses([...data.courses,...incoming]);data={...data,...imported,tags:[...new Set([...(data.tags||[]),...(imported.tags||[])])],courses:combined};save();alert(`Import complete: ${incoming.length} courses in file, ${combined.length} unique courses in dashboard (previously ${before}). Existing tags and manual overrides preserved.`);render()}catch(err){alert('Import failed: '+err.message)}e.target.value=''};render();

const PUBLIC_COURSES_API='https://script.google.com/macros/s/AKfycbyHNdi5VvAuMExwSl5MXx2stVMUgon1eiyXDNSxDyoaYTPF9VvKOhYGN6x7626RZ0UJoQ/exec';
function parseSheetTags(value){
  if(Array.isArray(value))return value;
  if(typeof value!=='string'||!value.trim())return [];
  try{const parsed=JSON.parse(value);if(Array.isArray(parsed))return parsed.map(String)}catch(e){}
  return value.split(',').map(x=>x.trim()).filter(Boolean);
}
function sheetCourseToDashboard(c){
  const learned=Number(c.variations_learned)||0;
  const total=Number(c.variations_total)||0;
  return {
    id:String(c.course_id||c.name||''),
    name:String(c.name||''),
    status:['Active','Inactive','Finished'].includes(c.status)?c.status:'Inactive',
    tags:parseSheetTags(c.tags),
    learned,total,
    percent:total?100*learned/total:0,
    manualOverride:c.manual_override===true||String(c.manual_override).toLowerCase()==='true',
    coverUrl:String(c.cover_url||''),
    lastUpdated:String(c.last_updated||''),
    courseUrl:/^https:\/\/(www\.)?chessable\.com\//i.test(String(c.source_url||''))&&!String(c.source_url).includes('/profile/')?String(c.source_url):''
  };
}
function loadPublicCourses(){
  const callbackName='chessDashboardCoursesCallback';
  const script=document.createElement('script');
  let done=false;
  const timeout=setTimeout(()=>finish(new Error('Connection timed out')),15000);
  function finish(error){
    if(done)return;
    done=true;
    clearTimeout(timeout);
    script.remove();
    delete window[callbackName];
    if(error)console.warn('Could not load published courses:',error);
  }
  window[callbackName]=payload=>{
    if(!payload||payload.success!==true||!Array.isArray(payload.courses)){
      finish(new Error('Invalid API response'));return;
    }
    data.courses=payload.courses.filter(c=>c&&c.name).map(sheetCourseToDashboard);
    data.tags=[...new Set(data.courses.flatMap(c=>c.tags))];
    if(Array.isArray(payload.weeklyStats)){
      weekly=payload.weeklyStats.filter(w=>w&&/^\d{4}-\d{2}-\d{2}$/.test(String(w.week_start||''))).map(w=>({
        week:String(w.week_start),
        reviewed:Number(w.variations_reviewed)||0,
        learned:Number(w.variations_learned)||0,
        pending:Number(w.reviews_pending)||0,
        days:Number(w.days_trained)||0,
        streak:w.current_streak==null?'—':Number(w.current_streak)||0
      }));
      localStorage.setItem('myChessWeekly_v1',JSON.stringify(weekly));
    }
    if(Array.isArray(payload.quotes)){
      INSPIRATION_QUOTES.splice(0,INSPIRATION_QUOTES.length,...payload.quotes.filter(q=>q&&q.Quote).map(q=>[String(q.Quote),String(q.Author||'Unknown'),String(q.Theme||'Philosophy')]));
      inspirationSheetLoaded=true;
      const s=inspirationState();
      s.favorites=payload.quotes.filter(q=>q&&q.Quote).flatMap((q,i)=>String(q.Favourite||'').toLowerCase()==='true'?[i]:[]);
      inspirationSave(s);
    }
    finish();
    render();
  };
  script.onerror=()=>finish(new Error('Unable to load API script'));
  script.src=PUBLIC_COURSES_API+'?callback='+encodeURIComponent(callbackName);
  document.head.appendChild(script);
}

function showOwnerMode(on){

function initGoogleLogin(){
  if(!window.google?.accounts?.oauth2){alert('Google sign-in is still loading. Please try again.');return false;}
  if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:OAUTH_CLIENT_ID,scope:EDIT_SCOPE,
    callback:async response=>{
      if(response.error||!response.access_token){alert('Google sign-in was not completed.');return;}
      // Sheets permissions are checked by Google on every read/write request.
      try{
        const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SPREADSHEET_ID+'/values/Courses!A1:A2',{headers:{Authorization:'Bearer '+response.access_token}});
        if(!r.ok)throw Error('This account cannot access the private Courses sheet (HTTP '+r.status+').');
        ownerToken=response.access_token;
        showOwnerMode(true);
        await loadInspirationSheet(); await loadGoals(); if(tab==='Goals')render();
      }catch(err){ownerToken=null;showOwnerMode(false);alert('Owner access was not granted: '+err.message);}
    }
  });
  return true;
}

async function persistCourse(c){
  if(!ownerToken)throw Error('Sign in first.');
  const i=data.courses.indexOf(c);
  if(i<0)throw Error('Course no longer found.');
  const row=i+2;
  const url='https://sheets.googleapis.com/v4/spreadsheets/'+SPREADSHEET_ID+'/values:batchUpdate';
  const body={valueInputOption:'RAW',data:[
    {range:`Courses!C${row}`,values:[[c.status]]},
    {range:`Courses!D${row}`,values:[[JSON.stringify(c.tags||[])]]},
    {range:`Courses!I${row}`,values:[[Boolean(c.manualOverride)]]}
  ]};
  const job=saving.then(async()=>{
    const r=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+ownerToken,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw Error('Google Sheets rejected the update (HTTP '+r.status+'). '+(r.status===401?'Your session may have expired. Sign out and sign in again.':''));
  });
  saving=job.catch(()=>{});
  return job;
}

 inspirationSave(s);renderInspiration(document.getElementById('app'));
}
function inspirationQuote(q,i,featured=false){const fav=inspirationState().favorites.includes(i);return featured?`<div class="quote-mark">“</div><blockquote>“${esc(q[0])}”</blockquote><div class="attribution">— ${esc(q[1])}</div><div class="muted" style="margin-top:8px">${esc(q[2])}</div><div class="tools"><button data-inspire-fav="${i}">${fav?'♥ Saved':'♡ Save favourite'}</button><button id="inspireAnother">Show another quote ↻</button></div>`:`<article class="inspire-item"><p>“${esc(q[0])}”</p><footer>— ${esc(q[1])} · ${esc(q[2])}</footer><div class="tools"><button class="${fav?'saved':''}" data-inspire-fav="${i}">${fav?'♥ Favourite':'♡ Favourite'}</button><button data-inspire-feature="${i}">Feature quote</button></div></article>`}
function renderInspiration(el){const all=inspirationAll(),chosen=inspirationRandom===null?inspirationWeekIndex():inspirationRandom%all.length;const themes=['All',...new Set(all.map(q=>q[2]))];const fav=inspirationState().favorites;const filtered=all.map((q,i)=>({q,i})).filter(({q,i})=>(inspirationTheme==='All'||q[2]===inspirationTheme)&&(!inspirationOnlyFavorites||fav.includes(i))&&[q[0],q[1],q[2]].join(' ').toLowerCase().includes(inspirationSearch.toLowerCase()));el.innerHTML=`<div class="heading"><div><div class="eyebrow">Wisdom from the board</div><h1>Inspiration</h1><div class="muted">A growing collection of chess wisdom, humour and ideas</div></div><div class="muted">${all.length} quotes · ${fav.length} favourites</div></div><section class="inspire-feature"><div class="eyebrow">${inspirationRandom===null?'Quote of the week':'Selected quote'}</div>${inspirationQuote(all[chosen],chosen,true)}</section><div class="heading"><div><h2>Quote library</h2><div class="muted">Explore, search and save your favourites</div></div></div><div class="tools inspire-controls"><input id="inspireSearch" aria-label="Search quotes" placeholder="Search quotes or authors..." value="${esc(inspirationSearch)}"><select id="inspireTheme" aria-label="Filter theme">${themes.map(t=>`<option value="${esc(t)}" ${t===inspirationTheme?'selected':''}>${esc(t)}</option>`).join('')}</select><button id="inspireFavorites">${inspirationOnlyFavorites?'♥ Favourites only':'♡ All quotes'}</button></div><div class="inspire-grid">${filtered.map(({q,i})=>inspirationQuote(q,i)).join('')||'<div class="panel">No matching quotes yet.</div>'}</div><section class="panel inspire-form"><h2>Add a quote</h2><p class="muted">Sign in with Google to save new quotes directly to your spreadsheet.</p><div class="inspire-controls"><textarea id="inspireText" placeholder="Quote text"></textarea><div class="tools" style="margin-top:10px"><input id="inspireAuthor" placeholder="Author"><select id="inspireNewTheme">${themes.filter(t=>t!=='All').map(t=>`<option>${esc(t)}</option>`).join('')}</select><button id="inspireAdd">Add quote</button></div></div></section>`;
el.querySelectorAll('[data-inspire-fav]').forEach(b=>b.onclick=()=>{inspirationToggleFavorite(+b.dataset.inspireFav).catch(err=>alert('Could not save favourite: '+err.message))});
el.querySelectorAll('[data-inspire-feature]').forEach(b=>b.onclick=()=>{inspirationRandom=+b.dataset.inspireFeature;renderInspiration(el);el.scrollIntoView({behavior:'smooth'})});
el.querySelector('#inspireAnother').onclick=()=>{inspirationRandom=(chosen+1+Math.floor(Math.random()*(all.length-1)))%all.length;renderInspiration(el)};
el.querySelector('#inspireSearch').oninput=e=>{const pos=e.target.selectionStart;inspirationSearch=e.target.value;renderInspiration(el);const input=el.querySelector('#inspireSearch');input.focus();input.setSelectionRange(pos,pos)};
el.querySelector('#inspireTheme').onchange=e=>{inspirationTheme=e.target.value;renderInspiration(el)};
el.querySelector('#inspireFavorites').onclick=()=>{inspirationOnlyFavorites=!inspirationOnlyFavorites;renderInspiration(el)};
el.querySelector('#inspireAdd').onclick=()=>{const quote=el.querySelector('#inspireText').value.trim(),author=el.querySelector('#inspireAuthor').value.trim(),theme=el.querySelector('#inspireNewTheme').value;if(!quote||!author){alert('Please enter both a quote and an author.');return}if(!ownerToken){alert('Sign in with Google to save quotes to your spreadsheet.');return}addInspirationQuote([quote,author,theme]).catch(err=>alert('Could not save quote: '+err.message))};
}
</script></body></html>
