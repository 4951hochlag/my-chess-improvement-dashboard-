<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Chess Improvement Dashboard</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e7edf5;background:#0c1220}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:24px max(24px,calc((100vw - 1320px)/2));border-bottom:1px solid #29344b;background:#111a2a}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-size:23px;font-weight:800;letter-spacing:-.6px}.sub{font-size:13px;color:#a0aec3;margin-top:5px}nav{display:flex;gap:7px;overflow:auto;padding-top:22px}nav button{white-space:nowrap;background:transparent;border:0;color:#a8b7ce;padding:11px 14px;border-radius:9px}nav button.active{background:#283f62;color:white}main{max-width:1320px;margin:auto;padding:30px 24px 70px}.eyebrow{color:#89a9d3;font-size:12px;text-transform:uppercase;letter-spacing:1.5px}.heading{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:23px}h1{font-size:30px;letter-spacing:-.7px;margin:6px 0}h2{font-size:20px;margin:0 0 14px}.muted{color:#9caec4}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:25px}.stat,.panel,.course{background:#151f31;border:1px solid #2a3950;border-radius:15px}.stat{padding:19px}.stat .number{font-size:29px;font-weight:800;margin:8px 0}.stat .name{color:#9bafc7;font-size:13px}.panel{padding:20px;margin-bottom:22px}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.tools input,.tools select,.tools button,.course select,.modal input{background:#0e1727;border:1px solid #3a4a62;color:#e7edf5;border-radius:9px;padding:10px 12px;min-height:42px}.tools input{flex:1;min-width:190px}.tools button,.btn{background:#29456d!important;color:#fff;border:1px solid #42648e!important;border-radius:9px;padding:10px 14px}.tools button:hover,.btn:hover{background:#345783!important}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.tag{border:1px solid #40536b;background:#202e42;color:#cbd8 </style></head><body><header><div class="head"><div><div class="brand">♞ My Chess Improvement Dashboard</div><div class="sub">A personal home for your chess progress</div></div><div class="tools"><span class="muted">♟ base_d_pawn</span><button id="googleLogin" class="theme-btn" type="button">Sign in with Google</button><button id="googleLogout" class="theme-btn hidden" type="button">Sign out</button><button id="themeToggle" class="theme-btn" aria-label="Toggle light and dark mode">☀ Light mode</button></div></div><nav id="nav"></nav></header><main id="app"></main><div class="modal-back" id="modalBack"><div class="modal"><h2 id="modalTitle">Edit course tags</h2><div class="muted" id="modalSub"></div><label>Available tags (select multiple)</label><div class="tags" id="modalTags"></div><label for="newTag">Create a new tag</label><div class="tools"><input id="newTag" placeholder="New tag name"><button id="addTag">Add tag</button></div><div class="modal-actions"><button class="btn" id="closeModal">Done</button></div></div></div><input id="fileInput" type="file" accept=".json,application/json" class="hidden"><script src="https://accounts.google.com/gsi/client" async defer></script><script src="data.js"></script><script src="weekly-data.js"></script><script src="chesscom.js?v=2"></script><script>
const THEME_KEY='myChessDashboard_theme';let currentTheme=localStorage.getItem(THEME_KEY)||'dark';function applyTheme(){document.body.classList.toggle('light',currentTheme==='light');const b=document.getElementById('themeToggle');if(b)b.textContent=currentTheme==='light'?'☾ Dark mode':'☀ Light mode'}document.getElementById('themeToggle').onclick=()=>{currentTheme=currentTheme==='light'?'dark':'light';localStorage.setItem(THEME_KEY,currentTheme);applyTheme()};applyTheme();
document.body.classList.add("public-view");
 function coverOf(c){for(const k of ['coverUrl','coverImageUrl','imageUrl','cover','image','thumbnailUrl','thumbnail','coverImage']){let v=c[k];if(v&&typeof v==='object')v=v.url||v.src;if(typeof v==='string'&&/^https?:\/\//i.test(v))return v}return ''}
function courseUrl(c){for(const k of ['courseUrl','url','chessableUrl','link']){let v=c[k];if(typeof v==='string'&&/^https:\/\/(www\.)?chessable\.com\//i.test(v)&&!v.includes('/profile/'))return v}return ''}
// Stable course matching: tolerate the tracker accidentally appending author/progress text.
function cleanCourseName(name){return String(name||'').normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/\s*\d+\s*\/\s*\d+\s*variations?.*$/i,'').replace(/\s+/g,' ').trim()}
function courseIdentity(c){for(const k of ['courseId','chessableCourseId','id']){if(c[k]!=null&&String(c[k]).trim())return 'id:'+String(c[k]).trim()}let u=courseUrl(c);if(u)return 'url:'+u.replace(/\?.*$/,'').replace(/\/$/,'');return 'name:'+cleanCourseName(c.name)}
function sameCourse(a,b){if(courseIdentity(a)===courseIdentity(b))return true;let x=cleanCourseName(a.name),y=cleanCourseName(b.name);if(x===y)return true;const shorter=x.length<y.length?x:y,longer=x.length<y.length?y:x;return shorter.length>=15&&longer.startsWith(shorter)&&(/^[\s:–—-]/.test(longer.slice(shorter.length))||/\d/.test(longer.slice(shorter.length,shorter.length+3)))&&(!a.total||!b.total||Number(a.total)===Number(b.total))}
function mergeCourse(existing,incoming){const preferIncoming=!!coverOf(incoming)||!coverOf(existing);return {...existing,...incoming,name:cleanCourseName(incoming.name).length>cleanCourseName(existing.name).length&&cleanCourseName(incoming.name).startsWith(cleanCourseName(existing.name))?existing.name:incoming.name,coverUrl:coverOf(preferIncoming?incoming:existing)||coverOf(existing)||coverOf(incoming),tags:[...new Set([...(existing.tags||[]),...(incoming.tags||[])])],status:existing.manualOverride?existing.status:incoming.status,manualOverride:!!existing.manualOverride||!!incoming.manualOverride}}
function dedupeCourses(courses){const unique=[];for(const c of courses){const idx=unique.findIndex(p=>sameCourse(p,c));if(idx<0)unique.push(c);else unique[idx]=mergeCourse(unique[idx],c)}return unique}
const TABS=['Home','Chess.com','Chessable','Goals','Game Reviews','Memorable Moments','Inspiration','Chess Books'];const STORAGE='myChessDashboard_v1';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString();let stored=null;try{stored=JSON.parse(localStorage.getItem(STORAGE)||'null')}catch(e){};let data=structuredClone(window.INITIAL_CHESSABLE_DATA);if(stored&&Array.isArray(stored.courses)){data.courses=dedupeCourses([...data.courses,...stored.courses]);data.tags=[...new Set([...(data.tags||[]),...(stored.tags||[])])]}else data.courses=dedupeCourses(data.courses);localStorage.setItem(STORAGE,JSON.stringify(data));let weekly=null;try{weekly=JSON.parse(localStorage.getItem('myChessWeekly_v1')||'null')}catch(e){};if(!Array.isArray(weekly))weekly=structuredClone(window.INITIAL_WEEKLY_DATA);localStorage.setItem('myChessWeekly_v1',JSON.stringify(weekly));let chessableView='Courses';let tab='Home',search='',status='All',selectedTag='All',editIndex=-1;function save(course){if(!ownerToken)return;persistCourse(course).catch(async err=>{alert("Changes could not be saved to Google Sheets: "+err.message+". Reloading the published data.");await loadPublicCourses();});}function tags(){return [...new Set([...(data.tags||[]),...data.courses.flatMap(c=>c.tags||[])])].sort((a,b)=>a.localeCompare(b))}function stats(){return {count:data.courses.length,learned:data.courses.reduce((s,c)=>s+(+c.learned||0),0),total:data.courses.reduce((s,c)=>s+(+c.total||0),0),active:data.courses.filter(c=>c.status==='Active').length,finished:data.courses.filter(c=>c.status==='Finished').length}}function stat(name,value,detail=''){return `<div class="stat"><div class="name">${name}</div><div class="number">${fmt(value)}</div><div class="tiny">${detail}</div></div>`}function renderNav(){document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t===tab?'active':''}" data-tab="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}function lastChessableSync(){
  const dates=data.courses.map(c=>c.lastUpdated).filter(Boolean).map(v=>Date.parse(v)).filter(Number.isFinite);
  return dates.length?new Date(Math.max(...dates)):null;
}
function syncIndicator(){
  const last=lastChessableSync();
  return '<div class="chessable-sync" role="status">Last synchronized: '+(last?esc(new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(last)):'Not available')+'</div>';
}
function render(){renderNav();let s=stats();let el=document.getElementById('app');if(tab==='Chess.com'){window.renderChessCom(el);window.ensureChessCom();return}if(tab==='Chessable'&&chessableView==='Weekly'){renderWeekly(el);return}if(tab==='Chessable'){let filtered=data.courses.map((c,i)=>({...c,_index:i})).filter(c=>(status==='All'||c.status===status)&&(selectedTag==='All'||(selectedTag==='Untagged'?!(c.tags||[]).length:(c.tags||[]).includes(selectedTag)))&&c.name.toLowerCase().includes(search.toLowerCase()));let counts=Object.fromEntries(tags().map(t=>[t,data.courses.filter(c=>(c.tags||[]).includes(t)).length]));el.innerHTML=`<div class="heading"><div><div class="eyebrow">Course library</div><h1>Chessable</h1><div class="muted">Course covers, progress, statuses and personal tags</div>${syncIndicator()}</div><div class="tools"><button id="importBtn">Import JSON</button><button id="exportBtn">Export JSON</button></div></div><div class="tools" style="margin-bottom:20px"><button id="viewCourses">Course library</button><button id="viewWeekly">Weekly activity</button></div><div class="stats">${stat('Courses',s.count)}${stat('Variations learned',s.learned)}${stat('Total variations',s.total)}${stat('Active courses',s.active,`${s.finished} finished`)}</div><div class="panel"><div class="tools"><input id="search" placeholder="Search courses…" value="${esc(search)}"><select id="statusFilter">${['All','Active','Inactive','Finished'].map(v=>`<option ${v===status?'selected':''}>${v}</option>`).join('')}</select><button id="clearFilters">Clear filters</button></div><div class="tags"><button class="tag ${selectedTag==='All'?'selected':''}" data-tag="All">All <span class="count">${s.count}</span></button><button class="tag ${selectedTag==='Untagged'?'selected':''}" data-tag="Untagged">Untagged <span class="count">${data.courses.filter(c=>!(c.tags||[]).length).length}</span></button>${tags().map(t=>`<button class="tag ${selectedTag===t?'selected':''}" data-tag="${esc(t)}">${esc(t)} <span class="count">${counts[t]}</span></button>`).join('')}</div></div><div class="heading"><h2>${fmt(filtered.length)} courses</h2><div class="tiny">${ownerToken?"Owner editing · saved to Google Sheets":"Public course library · read-only"}</div></div><div class="courses">${filtered.map(c=>`<article class="course"><div class="course-top"><div class="course-main">${coverOf(c)?`<img class="course-cover" src="${esc(coverOf(c))}" alt="Cover of ${esc(c.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}<div class="course-cover course-cover-fallback" style="${coverOf(c)?'display:none':''}" aria-hidden="true">♞</div><div class="course-info"><h3>${courseUrl(c)?`<a class="course-title-link" href="${esc(courseUrl(c))}" target="_blank" rel="noopener noreferrer">${esc(c.name)}</a>`:esc(c.name)}</h3><div class="meta">${fmt(c.learned)} / ${fmt(c.total)} variations learned · ${(+c.percent||0).toFixed(1).replace(/\.0$/,'')}%</div></div></div><select data-status="${c._index}" aria-label="Status for ${esc(c.name)}">${['Active','Inactive','Finished'].map(v=>`<option ${c.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,100*(+c.learned||0)/(+c.total||1)))}%"></div></div><div class="course-foot"><div class="tags" style="margin:0">${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'<span class="tiny">No tags</span>'}</div><button class="edit" data-edit="${c._index}">Edit tags</button></div></article>`).join('')}</div>${!filtered.length?'<div class="empty">No courses match these filters.</div>':''}<div class="foot">Course progress is published from the dashboard Google Sheet.</div>`;document.getElementById('viewCourses').onclick=()=>{chessableView='Courses';render()};document.getElementById('viewWeekly').onclick=()=>{chessableView='Weekly';render()};document.getElementById('search').oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;render();let inp=document.getElementById('search');inp.focus();inp.setSelectionRange(pos,pos)};document.getElementById('statusFilter').onchange=e=>{status=e.target.value;render()};document.getElementById('clearFilters').onclick=()=>{search='';status='All';selectedTag='All';render()};document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{selectedTag=b.dataset.tag;render()});document.querySelectorAll('[data-status]').forEach(b=>b.onchange=()=>{let c=data.courses[+b.dataset.status];c.status=b.value;c.manualOverride=true;save(c);render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(+b.dataset.edit));return}if(tab==='Home'){el.innerHTML=`<div class="eyebrow">Welcome back</div><h1>My Chess Improvement Dashboard</h1><p class="muted">Your chess journey, organized in one place.</p><div class="stats">${stat('Chessable courses',s.count)}${stat('Variations learned',s.learned)}${stat('Active courses',s.active)}${stat('Finished courses',s.finished)}</div><div class="home-grid"><section class="panel"><h2>Chessable course library</h2><p class="muted">Browse ${fmt(s.count)} courses, view tags and see which courses are currently active.</p><button class="btn" id="goChessable">Open Chessable →</button></section><section class="panel"><h2>Dashboard roadmap</h2><p class="muted">Chess.com ratings and game statistics are available in the Chess.com tab. Goals, game review videos, memorable positions, inspirational quotes and chess books are coming next.</p></section></div><div class="foot">♟ base_d_pawn · Chessable course data published from Google Sheets</div>`;document.getElementById('goChessable').onclick=()=>{tab='Chessable';render()};return}let copy={'Chess.com':'Ratings, games and performance trends will appear here.','Goals':'Set your own chess goals and track progress toward them.','Game Reviews':'Your coach’s shared Google Drive review videos will be organized here.','Memorable Moments':'Save positions, import FEN/PGN and replay memorable chess moments.','Inspiration':'Your personal collection of chess quotes and inspiration.','Chess Books':'Track your chess reading and learning resources.'};el.innerHTML=`<div class="placeholder"><div class="eyebrow">Coming next</div><h1>${esc(tab)}</h1><div class="panel"><p>${esc(copy[tab])}</p><p class="muted">This section is reserved in the site navigation. The Chessable section is functional now.</p><button class="btn" id="back">Explore Chessable</button></div></div>`;document.getElementById('back').onclick=()=>{tab='Chessable';render()}}

function renderWeekly(el){const ordered=[...weekly].sort((a,b)=>a.week.localeCompare(b.week));const sum=k=>ordered.reduce((n,w)=>n+(+w[k]||0),0);const max=Math.max(1,...ordered.flatMap(w=>[w.reviewed,w.learned]));const date=w=>new Date(w+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'});el.innerHTML=`<div class="heading"><div><div class="eyebrow">Chessable training history</div><h1>Weekly activity</h1><div class="muted">Weekly figures from Chessable's email summaries · ${ordered.length} recorded weeks</div></div><div class="tools"><button id="weeklyExport">Export weekly JSON</button></div></div><div class="tools" style="margin-bottom:20px"><button id="weeklyCourses">Course library</button><button id="weeklyHere">Weekly activity</button></div><div class="stats">${stat('Variations reviewed',sum('reviewed'))}${stat('Variations learned',sum('learned'))}${stat('Weeks recorded',ordered.length)}${stat('Avg reviewed/week',ordered.length?Math.round(sum('reviewed')/ordered.length):0)}${stat('Avg learned/week',ordered.length?Math.round(sum('learned')/ordered.length):0)}${stat('Avg days trained/week',ordered.length?(sum('days')/ordered.length).toFixed(1):'0.0')}</div><section class="panel"><h2>Weekly learned and reviewed variations</h2><div class="muted" style="font-size:12px;margin-bottom:15px">Blue = reviewed · Green = learned</div><div style="display:flex;gap:12px;align-items:end;height:235px;overflow-x:auto;padding-bottom:12px">${ordered.map(w=>`<div style="flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="height:185px;width:100%;display:flex;gap:5px;align-items:end;justify-content:center"><div title="${esc(w.week)}: ${w.reviewed} reviewed" style="background:#65a7ed;width:38%;height:${w.reviewed/max*100}%;min-height:2px;border-radius:5px 5px 0 0"></div><div title="${esc(w.week)}: ${w.learned} learned" style="background:#63c6a4;width:38%;height:${w.learned/max*100}%;min-height:2px;border-radius:5px 5px 0 0"></div></div><div class="tiny">${date(w.week)}</div></div>`).join('')}</div></section><section class="panel"><h2>Weekly records</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;text-align:left;min-width:610px"><thead><tr>${['Week of','Learned','Reviewed','Days trained','Streak'].map(x=>`<th style="padding:10px;border-bottom:1px solid #3a4a62">${x}</th>`).join('')}</tr></thead><tbody>${[...ordered].reverse().map(w=>`<tr>${[date(w.week),w.learned,w.reviewed,w.days,w.streak].map(x=>`<td style="padding:11px 10px;border-bottom:1px solid #29344b">${fmt(x)==='NaN'?esc(x):typeof x==='number'?fmt(x):esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section><div class="notice">The totals represent only the recorded email weeks, not your lifetime Chessable activity. Course variation totals are separate and should not be added to weekly review counts.</div>`;document.getElementById('weeklyCourses').onclick=()=>{chessableView='Courses';render()};document.getElementById('weeklyHere').onclick=()=>render();document.getElementById('weeklyExport').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schemaVersion:1,source:'Chessable weekly emails',weeks:weekly},null,2)],{type:'application/json'}));a.download='my-chessable-weekly-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}}

function openModal(i){editIndex=i;document.getElementById('modalBack').style.display='flex';renderModal()}function renderModal(){let c=data.courses[editIndex];document.getElementById('modalTitle').textContent='Edit course tags';document.getElementById('modalSub').textContent=c.name;document.getElementById('modalTags').innerHTML=tags().map(t=>`<button class="tag ${(c.tags||[]).includes(t)?'selected':''}" data-toggle="${esc(t)}">${esc(t)}</button>`).join('');document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let t=b.dataset.toggle;c.tags=c.tags||[];c.tags=c.tags.includes(t)?c.tags.filter(x=>x!==t):[...c.tags,t];save(c);renderModal();render()})}document.getElementById('closeModal').onclick=()=>{document.getElementById('modalBack').style.display='none';render()};document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')document.getElementById('closeModal').click()};document.getElementById('addTag').onclick=()=>{let t=document.getElementById('newTag').value.trim();if(!t)return;let existing=tags().find(x=>x.toLowerCase()===t.toLowerCase());t=existing||t;if(!data.tags)data.tags=[];if(!data.tags.includes(t))data.tags.push(t);let c=data.courses[editIndex];c.tags=c.tags||[];if(!c.tags.includes(t))c.tags.push(t);document.getElementById('newTag').value='';save(c);renderModal();render()};function exportJSON(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}));a.download='my-chessable-courses.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}document.getElementById('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let imported=JSON.parse(await f.text());if(!Array.isArray(imported.courses)||!imported.courses.every(c=>typeof c.name==='string'))throw Error('This file does not contain a valid course list.');const before=data.courses.length;const incoming=dedupeCourses(imported.courses);let combined=dedupeCourses([...data.courses,...incoming]);data={...data,...imported,tags:[...new Set([...(data.tags||[]),...(imported.tags||[])])],courses:combined};save();alert(`Import complete: ${incoming.length} courses in file, ${combined.length} unique courses in dashboard (previously ${before}). Existing tags and manual overrides preserved.`);render()}catch(err){alert('Import failed: '+err.message)}e.target.value=''};render();

// Public read-only course sync. Google Apps Script JSONP avoids GitHub Pages CORS restrictions.
const PUBLIC_COURSES_API='https://script.google.com/macros/s/AKfycbyHNdi5VvAuMExwSl5MXx2stVMUgon1eiyXDNSxDyoaYTPF9VvKOhYGN6x7626RZ0UJoQ/exec';
function parseSheetTags(value){
  if(Array.isArray(value))return value;
  if(typeof value!=='string'||!value.trim())return [];
  try{const parsed=JSON.parse(value);if(Array.isArray(parsed))return parsed.map(String)}catch(e){}
  return value.split(',').map(x=>x.trim()).filter(Boolean);
}
function sheetCourseToDashboard(c){
  const learned=Number(c.variations_learned)||0;
  const total=Number(c.variations_total)||0;
  return {
    id:String(c.course_id||c.name||''),
    name:String(c.name||''),
    status:['Active','Inactive','Finished'].includes(c.status)?c.status:'Inactive',
    tags:parseSheetTags(c.tags),
    learned,total,
    percent:total?100*learned/total:0,
    manualOverride:c.manual_override===true||String(c.manual_override).toLowerCase()==='true',
    coverUrl:String(c.cover_url||''),
    lastUpdated:String(c.last_updated||''),
    courseUrl:/^https:\/\/(www\.)?chessable\.com\//i.test(String(c.source_url||''))&&!String(c.source_url).includes('/profile/')?String(c.source_url):''
  };
}
function loadPublicCourses(){
  const callbackName='chessDashboardCoursesCallback';
  const script=document.createElement('script');
  let done=false;
  const timeout=setTimeout(()=>finish(new Error('Connection timed out')),15000);
  function finish(error){
    if(done)return;
    done=true;
    clearTimeout(timeout);
    script.remove();
    delete window[callbackName];
    if(error)console.warn('Could not load published courses:',error);
  }
  window[callbackName]=payload=>{
    if(!payload||payload.success!==true||!Array.isArray(payload.courses)){
      finish(new Error('Invalid API response'));return;
    }
    data.courses=payload.courses.filter(c=>c&&c.name).map(sheetCourseToDashboard);
    data.tags=[...new Set(data.courses.flatMap(c=>c.tags))];
    if(Array.isArray(payload.weeklyStats)){
      weekly=payload.weeklyStats.filter(w=>w&&/^\d{4}-\d{2}-\d{2}$/.test(String(w.week_start||''))).map(w=>({
        week:String(w.week_start),
        reviewed:Number(w.variations_reviewed)||0,
        learned:Number(w.variations_learned)||0,
        pending:Number(w.reviews_pending)||0,
        days:Number(w.days_trained)||0,
        streak:w.current_streak==null?'—':Number(w.current_streak)||0
      }));
      localStorage.setItem('myChessWeekly_v1',JSON.stringify(weekly));
    }
    finish();
    render();
  };
  script.onerror=()=>finish(new Error('Unable to load API script'));
  script.src=PUBLIC_COURSES_API+'?callback='+encodeURIComponent(callbackName);
  document.head.appendChild(script);
}
// Owner edits use a short-lived Google OAuth access token and the Sheets API.
// No client secret, shared write password, or write-enabled Apps Script endpoint is published.
const OAUTH_CLIENT_ID='55482817629-jk5pr8ffsb1jt16s0qrq37c6rcji5oml.apps.googleusercontent.com';
const SPREADSHEET_ID='1oNWCoMi8Xs9E-w4cHLDLJIzY77AENYEa3P-786ufsN8';
const EDIT_SCOPE='https://www.googleapis.com/auth/spreadsheets';
let ownerToken=null, tokenClient=null, saving=Promise.resolve();
function showOwnerMode(on){
  document.body.classList.toggle('public-view',!on);
  document.getElementById('googleLogin').classList.toggle('hidden',on);
  document.getElementById('googleLogout').classList.toggle('hidden',!on);
  render();
}
function initGoogleLogin(){
  if(!window.google?.accounts?.oauth2){alert('Google sign-in is still loading. Please try again.');return false;}
  if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:OAUTH_CLIENT_ID,scope:EDIT_SCOPE,
    callback:async response=>{
      if(response.error||!response.access_token){alert('Google sign-in was not completed.');return;}
      // Sheets permissions are checked by Google on every read/write request.
      try{
        const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SPREADSHEET_ID+'/values/Courses!A1:A2',{headers:{Authorization:'Bearer '+response.access_token}});
        if(!r.ok)throw Error('This account cannot access the private Courses sheet (HTTP '+r.status+').');
        ownerToken=response.access_token;
        showOwnerMode(true);
      }catch(err){ownerToken=null;showOwnerMode(false);alert('Owner access was not granted: '+err.message);}
    }
  });
  return true;
}
document.getElementById('googleLogin').onclick=()=>{if(initGoogleLogin())tokenClient.requestAccessToken({prompt:'consent'});};
document.getElementById('googleLogout').onclick=()=>{
  if(ownerToken&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(ownerToken,()=>{});
  ownerToken=null;showOwnerMode(false);loadPublicCourses();
};
async function persistCourse(c){
  if(!ownerToken)throw Error('Sign in first.');
  const i=data.courses.indexOf(c);
  if(i<0)throw Error('Course no longer found.');
  const row=i+2;
  const url='https://sheets.googleapis.com/v4/spreadsheets/'+SPREADSHEET_ID+'/values:batchUpdate';
  const body={valueInputOption:'RAW',data:[
    {range:`Courses!C${row}`,values:[[c.status]]},
    {range:`Courses!D${row}`,values:[[JSON.stringify(c.tags||[])]]},
    {range:`Courses!I${row}`,values:[[Boolean(c.manualOverride)]]}
  ]};
  const job=saving.then(async()=>{
    const r=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+ownerToken,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw Error('Google Sheets rejected the update (HTTP '+r.status+'). '+(r.status===401?'Your session may have expired. Sign out and sign in again.':''));
  });
  saving=job.catch(()=>{});
  return job;
}
loadPublicCourses();
